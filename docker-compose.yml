version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: fandrobe-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
      - redis
    networks:
      - fandrobe-network

  web:
    image: nginx:alpine
    container_name: fandrobe-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/web/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - fandrobe-network

  db:
    image: mysql:8.0
    container_name: fandrobe-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - fandrobe-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: fandrobe-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USERNAME:-root}
      PMA_PASSWORD: ${DB_PASSWORD:-root}
    depends_on:
      - db
    networks:
      - fandrobe-network

  redis:
    image: redis:alpine
    container_name: fandrobe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - fandrobe-network

  mongo:
    image: mongo:latest
    container_name: fandrobe-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - fandrobe-network

networks:
  fandrobe-network:
    driver: bridge

volumes:
  db-data:
  mongo-data:
